name: Generate favicon assets

on:
  push:
    paths:
      - favicon.svg
      - .github/workflows/generate-favicon.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install favicon tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
      - name: Generate PNG and ICO assets
        run: |
          rsvg-convert -w 16 -h 16 favicon.svg > favicon-16x16.png
          rsvg-convert -w 32 -h 32 favicon.svg > favicon-32x32.png
          rsvg-convert -w 96 -h 96 favicon.svg > favicon-96x96.png
          rsvg-convert -w 180 -h 180 favicon.svg > apple-touch-icon.png
          rsvg-convert -w 192 -h 192 favicon.svg > web-app-manifest-192x192.png
          rsvg-convert -w 512 -h 512 favicon.svg > web-app-manifest-512x512.png
          convert favicon-16x16.png favicon-32x32.png favicon-96x96.png favicon.ico
      - name: Commit generated assets
        run: |
          rm -f .github/workflows/generate-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-16x16.png favicon-32x32.png favicon-96x96.png favicon.ico apple-touch-icon.png web-app-manifest-192x192.png web-app-manifest-512x512.png .github/workflows/generate-favicon.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: add complete favicon asset set [skip ci]"
          git push
